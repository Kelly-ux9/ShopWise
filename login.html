<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | ShopWise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html"><img src="im2.png" alt="">ShopWise</a><h1>Welcome back.</h1><p>Log in to continue to your ShopWise account.</p><form id="loginForm"><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="auth-submit" id="submit" type="submit">Log in</button><div id="message" class="auth-message"></div><div id="networkNote" class="auth-network-note">The authentication service could not be reached. Please check that the ShopWise Supabase project is active and try again.</div></form><p class="auth-switch">New to ShopWise? <a href="sign_up.html">Create an account</a></p></main>
<script type="module">import{supabase}from'./supabase.js';const f=document.getElementById('loginForm'),m=document.getElementById('message'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();m.className='auth-message';m.textContent='';document.getElementById('networkNote').classList.remove('show');b.disabled=true;b.textContent='Signing in…';let data,error;try{({data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}));}catch(networkError){document.getElementById('networkNote').classList.add('show');b.disabled=false;b.textContent='Log in';return}if(error){m.className='auth-message error show';m.textContent=error.message;b.disabled=false;b.textContent='Log in';return}const role=data.user?.user_metadata?.role||'buyer';location.href=role==='seller'?'seller_dashboard.html':'buyer_dashboard.html'});</script></body></html>
