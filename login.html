<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ShopWise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"></head><body><header id="nav-placeholder"></header><main class="auth-page"><form class="auth-card" id="loginForm"><h1>Welcome back</h1><p>Sign in to continue to your ShopWise account.</p><div class="input-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="input-group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><div class="role-toggle"><label><input type="radio" name="role" value="Buyer" checked><span>Buyer</span></label><label><input type="radio" name="role" value="Seller"><span>Seller</span></label></div><button class="auth-submit" type="submit">Sign in</button><div id="message" class="auth-message"></div><div class="auth-links">Don't have an account? <a href="sign_up.html">Create one</a></div></form></main><script src="js/nav.js"></script><script type="module">import { supabase } from './supabase.js'; import { getProfile } from './js/auth.js'; const form=document.getElementById('loginForm'), msg=document.getElementById('message'); form.addEventListener('submit',async e=>{e.preventDefault(); msg.className='auth-message'; msg.textContent='Signing in...'; try{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const selected=document.querySelector('input[name="role"]:checked').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error) throw error; const profile=await getProfile(data.user.id); if(profile.role!==selected) throw new Error(`This account is registered as ${profile.role}. Select ${profile.role} to continue.`); window.location.href=profile.role==='Seller'?'seller_dashboard.html':'buyer_dashboard.html';}catch(err){msg.className='auth-message error';msg.textContent=err.message||'Unable to sign in. Check your connection and credentials.';}});</script></body></html>
