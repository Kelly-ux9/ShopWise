<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Products | ShopWise</title><link rel="stylesheet" href="style.css"></head><body><header id="nav-placeholder"></header><main class="content"><div class="about-container"><h1>Manage Products</h1><p style="color:#66736d;margin-bottom:25px">Add products to your ShopWise storefront.</p><form id="productForm"><div class="input-group"><label>Name</label><input id="name" required></div><div class="input-group"><label>Price (RWF)</label><input id="price" type="number" min="0" step="0.01" required></div><div class="input-group"><label>Category</label><select id="category"><option>Coffee</option><option>Basket</option><option>Tea</option><option>Art</option><option>Other</option></select></div><div class="input-group"><label>Origin</label><input id="origin" value="Rwanda" required></div><div class="input-group"><label>Image path or URL</label><input id="image" placeholder="products/coffee.jpg" required></div><div class="input-group"><label>Description</label><input id="description"></div><button class="auth-submit">Add Product</button><div id="message" class="auth-message"></div></form><div id="productList" style="margin-top:35px"></div></div></main><script src="js/nav.js"></script><script type="module">import {supabase} from './supabase.js';const form=document.getElementById('productForm'),list=document.getElementById('productList'),msg=document.getElementById('message');async function load(){const {data,error}=await supabase.from('products').select('*').eq('seller_id',(await supabase.auth.getUser()).data.user?.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(p=>`<div class="step" style="margin:10px 0"><strong>${p.name}</strong><div>${Number(p.price).toLocaleString()} RWF · ${p.category}</div></div>`).join('')}form.addEventListener('submit',async e=>{e.preventDefault();const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html';return}const {error}=await supabase.from('products').insert({seller_id:user.id,name:name.value.trim(),price:Number(price.value),category:category.value,origin:origin.value.trim(),image:image.value.trim(),description:description.value.trim()});if(error){msg.className='auth-message error';msg.textContent=error.message;return}msg.className='auth-message success';msg.textContent='Product added.';form.reset();await load()});load();</script></body></html>
