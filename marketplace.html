<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace | ShopWise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"></head><body><header id="nav-placeholder"></header><main><section class="hero-modern" style="min-height:360px"><div class="hero-content-modern"><span class="section-kicker" style="color:#bcead7">SHOPWISE MARKETPLACE</span><h1>Discover products from Africa.</h1><p>Explore authentic products from Rwandan sellers and connect with a wider market.</p></div></section><section id="marketplace-preview"><div class="section-heading"><div><span class="section-kicker">DISCOVER</span><h2>Marketplace</h2></div><p>Search by product or filter by category.</p></div><div class="marketplace-filter"><input id="search-input" type="search" placeholder="Search products..."><select id="category-select"><option value="all">All categories</option><option value="Coffee">Coffee</option><option value="Basket">Basket</option><option value="Tea">Tea</option><option value="Art">Art</option><option value="Other">Other</option></select></div><div class="product-grid" id="product-grid"></div><p id="marketplace-message" style="text-align:center;color:#66736d"></p></section></main><footer class="footer-modern"><div class="footer-bottom"><span>© <span data-current-year></span> ShopWise. Built from Rwanda.</span><span>Connecting products. Connecting people. Connecting markets.</span></div></footer><div id="product-modal" class="modal"><div class="modal-content"><button class="close" id="close-modal" aria-label="Close">&times;</button><div id="modal-body"></div></div></div><script src="js/nav.js"></script><script type="module">import { supabase } from './supabase.js'; import { getSession } from './js/auth.js'; const grid=document.getElementById('product-grid'), search=document.getElementById('search-input'), category=document.getElementById('category-select'), msg=document.getElementById('marketplace-message'), modal=document.getElementById('product-modal'), modalBody=document.getElementById('modal-body'); let products=[]; function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));} function render(){const q=search.value.trim().toLowerCase(),cat=category.value;const list=products.filter(p=>(!q||`${p.name} ${p.description} ${p.origin}`.toLowerCase().includes(q))&&(cat==='all'||p.category===cat));grid.innerHTML=list.map(p=>`<article class="product-card"><div class="product-image"><img src="${esc(p.image)}" alt="${esc(p.name)}"><span class="product-badge">${esc(p.category)}</span></div><div class="product-info"><h3>${esc(p.name)}</h3><p class="product-origin">${esc(p.origin)}</p><p class="product-price">${Number(p.price).toLocaleString()} RWF</p><button data-view="${p.id}">View Details</button></div></article>`).join('');msg.textContent=list.length?'': 'No products match your search.';grid.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openProduct(Number(b.dataset.view))));} function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;modalBody.innerHTML=`<h2>${esc(p.name)}</h2><p style="color:#66736d">${esc(p.origin)} · ${esc(p.category)}</p><p style="margin:18px 0">${esc(p.description)}</p><h3 style="color:#087f5b">${Number(p.price).toLocaleString()} RWF</h3><div style="display:flex;gap:10px;margin-top:20px"><button class="view-details" id="buy-now">Buy Now</button><button class="view-details" id="add-cart">Add to Cart</button></div>`;modal.style.display='block';document.getElementById('buy-now').onclick=()=>placeOrder(p.id);document.getElementById('add-cart').onclick=()=>addCart(p.id);} async function addCart(id){try{const session=await getSession();if(!session){window.location.href='login.html';return;}const {error}=await supabase.from('cart').upsert({user_id:session.user.id,product_id:id,quantity:1},{onConflict:'user_id,product_id'});if(error)throw error;alert('Product added to your cart.');}catch(e){alert(e.message||'Unable to add to cart.');}} async function placeOrder(id){try{const session=await getSession();if(!session){window.location.href='login.html';return;}const {error}=await supabase.from('orders').insert({buyer_id:session.user.id,product_id:id,quantity:1});if(error)throw error;modal.style.display='none';alert('Order placed successfully.');}catch(e){alert(e.message||'Unable to place order.');}} async function load(){const {data,error}=await supabase.from('products').select('id,name,description,price,image,category,origin').eq('is_active',true).order('created_at',{ascending:false});if(error){msg.textContent='Marketplace could not load. Please check your Supabase connection.';console.error(error);return;}products=data||[];render();} search.addEventListener('input',render);category.addEventListener('change',render);document.getElementById('close-modal').onclick=()=>modal.style.display='none';window.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});load();</script></body></html>
