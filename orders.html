<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | ShopWise</title><link rel="stylesheet" href="style.css"></head><body><header id="nav-placeholder"></header><main class="content"><div class="about-container"><h1>Customer Orders</h1><div id="orders" style="margin-top:25px"></div></div></main><script src="js/nav.js"></script><script type="module">import {supabase} from './supabase.js';const box=document.getElementById('orders');async function load(){const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await supabase.from('orders').select('id,product_id,quantity,total_price,status,created_at').eq('seller_id',user.id).order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).map(o=>`<div class="step" style="margin:10px 0"><strong>Order #${o.id}</strong><p>Product: ${o.product_id} · Quantity: ${o.quantity}</p><p>${Number(o.total_price).toLocaleString()} RWF · ${o.status}</p></div>`).join('')||'<p>No orders yet.</p>'}load();</script></body></html>
