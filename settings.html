<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | ShopWise</title><link rel="stylesheet" href="style.css"></head><body><header id="nav-placeholder"></header><main class="content"><div class="about-container"><h1>Account Settings</h1><form id="settingsForm"><div class="input-group"><label>Full name</label><input id="name" required></div><button class="auth-submit">Update Name</button><div id="message" class="auth-message"></div></form></div></main><script src="js/nav.js"></script><script type="module">import {supabase} from './supabase.js';const form=document.getElementById('settingsForm'),msg=document.getElementById('message');async function load(){const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html';return}const {data}=await supabase.from('profiles').select('full_name').eq('id',user.id).single();name.value=data?.full_name||''}form.addEventListener('submit',async e=>{e.preventDefault();const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html';return}const {error}=await supabase.from('profiles').update({full_name:name.value.trim(),updated_at:new Date().toISOString()}).eq('id',user.id);msg.className=error?'auth-message error':'auth-message success';msg.textContent=error?.message||'Profile updated.'});load();</script></body></html>
