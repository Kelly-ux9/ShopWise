<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | ShopWise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html"><img src="im2.png" alt="">ShopWise</a><h1>Join ShopWise.</h1><p>Create a buyer or seller account using secure Supabase Authentication.</p><form id="signupForm"><div class="form-group"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="form-group"><label for="role">Account type</label><select id="role"><option value="buyer">Buyer</option><option value="seller">Seller</option></select></div><button class="auth-submit" id="submit" type="submit">Create account</button><div id="message" class="auth-message"></div><div id="networkNote" class="auth-network-note">The authentication service could not be reached. Please check that the ShopWise Supabase project is active and try again.</div></form><p class="auth-switch">Already registered? <a href="login.html">Log in</a></p></main>
<script type="module">import{supabase}from'./supabase.js';const f=document.getElementById('signupForm'),m=document.getElementById('message'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();m.className='auth-message';m.textContent='';document.getElementById('networkNote').classList.remove('show');b.disabled=true;b.textContent='Creating…';const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,role=document.getElementById('role').value;let data,error;try{({data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name,role}}}));}catch(networkError){document.getElementById('networkNote').classList.add('show');b.disabled=false;b.textContent='Create account';return}if(error){m.className='auth-message error show';m.textContent=error.message;b.disabled=false;b.textContent='Create account';return}m.className='auth-message success show';m.textContent=data.session?'Account created. Redirecting…':'Account created. Check your email to confirm your account, then log in.';if(data.session)setTimeout(()=>location.href=role==='seller'?'seller_dashboard.html':'buyer_dashboard.html',700);else{b.disabled=false;b.textContent='Create account'}});</script></body></html>
